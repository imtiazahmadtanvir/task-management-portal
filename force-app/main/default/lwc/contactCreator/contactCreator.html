<template>
    <lightning-card title="Create Contact" icon-name="standard:contact">
        <div class="slds-p-around_medium">

            <lightning-input
                label="First Name"
                value={firstName}
                onchange={handleFirstNameChange}>
            </lightning-input>

            <lightning-input
                label="Last Name"
                value={lastName}
                onchange={handleLastNameChange}
                required>
            </lightning-input>

            <lightning-input
                type="email"
                label="Email"
                value={email}
                onchange={handleEmailChange}>
            </lightning-input>

            <lightning-combobox
                label="Account"
                value={accountId}
                options={accountOptions}
                onchange={handleAccountChange}
                placeholder="Select an Account"
                required>
            </lightning-combobox>

            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Create Contact"
                    onclick={handleCreateContact}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
