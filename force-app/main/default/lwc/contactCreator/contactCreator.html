<template>
    <lightning-card title="Create Contact" icon-name="standard:contact">
        <div class="slds-p-around_medium">

            <!-- ERROR ALERT BANNER -->
            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <h2>{errorMessage}</h2>
                </div>
            </template>

            <!-- SUCCESS ALERT BANNER -->
            <template if:true={successMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">Success</span>
                    <h2>{successMessage}</h2>
                </div>
            </template>

            <!-- LOADING SPINNER -->
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-m-bottom_medium">
                    <lightning-spinner alternative-text="Creating Contact..." size="small"></lightning-spinner>
                </div>
            </template>

            <lightning-input
                label="First Name"
                value={firstName}
                onchange={handleFirstNameChange}>
            </lightning-input>

            <lightning-input
                label="Last Name"
                value={lastName}
                onchange={handleLastNameChange}
                required>
            </lightning-input>

            <lightning-input
                type="email"
                label="Email"
                value={email}
                onchange={handleEmailChange}>
            </lightning-input>

            <lightning-input
                type="tel"
                label="Phone"
                value={phone}
                onchange={handlePhoneChange}>
            </lightning-input>

            <lightning-record-edit-form object-api-name="Contact">
                <lightning-input-field
                    field-name="AccountId"
                    value={accountId}
                    onchange={handleAccountChange}
                    required>
                </lightning-input-field>
            </lightning-record-edit-form>

            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Create Contact"
                    onclick={handleCreateContact}>
                </lightning-button>
            </div>

            <!-- IN-PAGE ERROR MESSAGE UNDER BUTTON -->
            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-m-top_medium">
                    {errorMessage}
                </div>
            </template>

            <!-- IN-PAGE SUCCESS MESSAGE UNDER BUTTON -->
            <template if:true={successMessage}>
                <div class="slds-text-color_success slds-m-top_medium">
                    {successMessage}
                </div>
            </template>

        </div>
    </lightning-card>
</template>
